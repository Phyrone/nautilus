[workspace]
resolver = "3"
members = [
    "lib/crds/",
    "services/operator"
]
[workspace.package]
version = "0.0.1-SNAPSHOT"
edition = "2024"
license = "EUPL-1.2"
license-file = "LICENSE.txt"

[workspace.dependencies]

clap = { version = "4.6.7", features = ["derive", "env", "string", "unicode"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }

indicatif = { version = "0.18.6", features = ["futures", "improved_unicode", "rayon", "tokio", "unicode-segmentation"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["derive", "ws", "gzip", "runtime"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive", "rc", "alloc"] }
serde_json = { version = "1.0.151", features = ["alloc"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-util = { version = "0.7.19", features = ["full", "tracing"] }
futures = { version = "0.3.34", features = ["std"] }

error-stack = { version = "0.8.0", features = ["serde", "std", "backtrace"] }
thiserror = "2.0.21"
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

bytesize = { version = "2.7.0", features = ["serde"] }


lib-crds = { path = "lib/crds", package = "crds" }
